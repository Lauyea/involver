name: Deploy to production

# 只允許手動觸發：Actions → Deploy to production → Run workflow
on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: '套用資料庫 migration（有 schema 變更時才勾選）'
        type: boolean
        default: false
      deploy_web:
        description: '部署網站'
        type: boolean
        default: true
      deploy_functions:
        description: '部署排程工作 (Azure Functions)'
        type: boolean
        default: true

# 同一時間只允許一個部署在跑，後來的會排隊而不是取消前一個
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  IMAGE_NAME: involver
  # 連線字串來源：網站 App Service 的 Connection strings，與 app 讀的是同一筆
  CONNECTION_STRING_NAME: ConnectionStrings

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 產 migration-review.sql 時要查之前的部署紀錄

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # 要讀上次部署那個 commit 的 migration 清單
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: |
        dotnet restore
        dotnet tool restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # idempotent：每個 migration 都會先檢查 __EFMigrationsHistory，只補跑正式 DB 缺少的部分
    - name: Generate migration SQL
      if: ${{ inputs.run_migration }}
      run: >
        dotnet ef migrations script
        --idempotent
        --no-build
        --project DataAccess
        --startup-project Involver
        --output artifacts/migration.sql
    # 部署前可以在這次執行的頁面下載這份 SQL 來檢查
    - name: Upload migration SQL
      if: ${{ inputs.run_migration }}
      uses: actions/upload-artifact@v7
      with:
        name: migration-sql
        path: artifacts/migration.sql

    # 只給人審查用：上次成功套用 migration 之後新增的部分。實際執行的仍是上面的 migration.sql
    - name: Generate migration review SQL
      if: ${{ inputs.run_migration }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        out=artifacts/migration-review.sql

        # 列出某個 commit 裡的 migration（排除 Designer.cs 與 Snapshot），依時間排序
        list_migrations() {
          git ls-tree --name-only "$1" DataAccess/Migrations/ \
            | sed 's#.*/##' \
            | { grep -E '^[0-9]{14}_[^.]+\.cs$' || true; } \
            | sed 's/\.cs$//' \
            | sort
        }

        # 上次成功且有勾 run_migration 的部署：該次執行會留下 migration-sql artifact
        base_sha=""
        for run in $(gh run list --workflow deploy.yml --status success --limit 50 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
          found=$(gh api "repos/${{ github.repository }}/actions/runs/${run%%:*}/artifacts" \
            --jq '.artifacts[] | select(.name == "migration-sql") | .name')
          if [ -n "$found" ]; then
            base_sha="${run#*:}"
            break
          fi
        done

        latest=$(list_migrations HEAD | tail -n1)
        if [ -n "$base_sha" ] && git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
          from=$(list_migrations "$base_sha" | tail -n1)
          base_note="上次成功套用 migration 的部署 commit：$base_sha"
        else
          echo "::warning::找不到上次成功套用 migration 的部署紀錄，migration-review.sql 會包含全部 migration"
          from=""
          base_note="找不到上次成功套用 migration 的部署紀錄，以下為全部 migration"
        fi

        # migration 名稱以時間戳開頭，字串比較即可找出比基準新的
        new_migrations=$(list_migrations HEAD | awk -v from="$from" '$0 > from')

        {
          echo "-- 審查用，不會被執行。實際套用的是 migration.sql（idempotent，會略過正式 DB 已執行過的 migration）"
          echo "-- $base_note"
          echo "-- 若正式 DB 曾手動調整、或上次部署中途失敗，實際補跑的範圍可能比這份多"
          echo
        } > "$out"

        {
          echo "### Migration 審查"
          echo "$base_note"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -z "$new_migrations" ]; then
          echo "-- 沒有新的 migration" >> "$out"
          echo "沒有新的 migration" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "$new_migrations" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          dotnet ef migrations script "${from:-0}" "$latest" \
            --no-build \
            --project DataAccess \
            --startup-project Involver \
            --output artifacts/review-body.sql
          cat artifacts/review-body.sql >> "$out"
        fi
    - name: Upload migration review SQL
      if: ${{ inputs.run_migration }}
      uses: actions/upload-artifact@v7
      with:
        name: migration-review
        path: artifacts/migration-review.sql

    - name: Publish Functions
      if: ${{ inputs.deploy_functions }}
      run: dotnet publish InvolverRoutineWork --configuration Release --output artifacts/functions
    - name: Upload Functions package
      if: ${{ inputs.deploy_functions }}
      uses: actions/upload-artifact@v7
      with:
        name: functions
        path: artifacts/functions
        include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # production Environment 設有 required reviewer，會在這裡暫停等核准
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC 登入 Azure 需要
    # Azure 資源名稱放在 production Environment 的 variables，不寫在 repo 裡
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}
      FUNCTIONAPP_NAME: ${{ vars.FUNCTIONAPP_NAME }}

    steps:
    - name: Check environment settings
      run: |
        missing=0
        for name in AZURE_RESOURCE_GROUP ACR_LOGIN_SERVER WEBAPP_NAME FUNCTIONAPP_NAME; do
          if [ -z "${!name}" ]; then
            echo "::error::production Environment 缺少 variable：$name"
            missing=1
          fi
        done
        exit $missing

    - uses: actions/checkout@v5

    # 登入用的 ID 放在 production Environment 的 secrets，log 裡會顯示成 ***
    - name: Azure login (OIDC)
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 先把 image 建好推上去，build 失敗就不會動到資料庫
    - name: Build and push image
      if: ${{ inputs.deploy_web }}
      run: |
        # 部署身分只有 AcrPush，查不到 registry 資源本身，所以要自己給完整的 login server。
        # login server 帶有網域名稱標籤時（name-xxxx.azurecr.io），要用 --suffix 指定後綴。
        registry="${ACR_LOGIN_SERVER%%.*}"
        if [[ "$registry" == *-* ]]; then
          az acr login --name "${registry%%-*}" --suffix "${registry#*-}"
        else
          az acr login --name "$registry"
        fi
        image="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
        docker build --file Involver/Dockerfile --tag "$image" .
        docker push "$image"

    - name: Download migration SQL
      if: ${{ inputs.run_migration }}
      uses: actions/download-artifact@v8
      with:
        name: migration-sql
        path: artifacts
    # 直接從 App Service 讀連線字串，不另外存一份在 GitHub
    - name: Read connection string from App Service
      if: ${{ inputs.run_migration }}
      run: |
        conn=$(az webapp config connection-string list \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "$WEBAPP_NAME" \
          --output json \
          | jq -r --arg name "$CONNECTION_STRING_NAME" \
            '.[] | select(.name == $name) | (.value | if type == "object" then .value else . end)')
        if [ -z "$conn" ]; then
          echo "::error::在 $WEBAPP_NAME 的 Connection strings 找不到 $CONNECTION_STRING_NAME"
          exit 1
        fi
        echo "::add-mask::$conn"
        echo "SQL_CONNECTION_STRING=$conn" >> "$GITHUB_ENV"
    # 已經 azure/login，sql-action 連不上時會自動為 runner IP 加暫時的防火牆規則，跑完再移除
    - name: Apply migration
      if: ${{ inputs.run_migration }}
      uses: azure/sql-action@v2.4
      with:
        connection-string: ${{ env.SQL_CONNECTION_STRING }}
        path: artifacts/migration.sql
        arguments: '-b' # SQL 發生錯誤時讓這個步驟失敗

    - name: Deploy web app
      if: ${{ inputs.deploy_web }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Download Functions package
      if: ${{ inputs.deploy_functions }}
      uses: actions/download-artifact@v8
      with:
        name: functions
        path: artifacts/functions
    - name: Deploy Functions
      if: ${{ inputs.deploy_functions }}
      uses: azure/functions-action@v1
      with:
        app-name: ${{ env.FUNCTIONAPP_NAME }}
        package: artifacts/functions
