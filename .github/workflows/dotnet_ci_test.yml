name: .NET project build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # 允許手動觸發

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # 格式檢查要找 PR 與 master 的 merge-base
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Format check (changed lines only)
      # 只檢查 PR 改到的 C# 行：空白格式與命名規則（Tools/FormatCheck/fmtcheck.cs）
      if: github.event_name == 'pull_request'
      working-directory: Tools/FormatCheck
      run: dotnet run fmtcheck.cs -- --base origin/${{ github.base_ref }}
    - name: Test
      run: dotnet test --no-build --verbosity normal
